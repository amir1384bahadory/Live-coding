[defaults]

# Inventory
inventory = ./inventory/inventory.yaml

# Roles
roles_path = ./roles

# SSH
host_key_checking = True
timeout = 10

# Python
interpreter_python = auto_silent

# Performance
forks = 10

# Disable retry files
retry_files_enabled = False


[privilege_escalation]

# Use sudo for privileged operations
become = True
become_method = sudo
become_ask_pass = False
